name: Responsive interface QA
on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'tests/e2e/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/responsive-qa.yml'
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_LIVE_STYLIST_EVAL: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - run: yarn playwright install --with-deps chromium
      - run: yarn playwright test tests/e2e/responsive-parity.spec.ts --project=chromium
      - name: Store viewport screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: responsive-debug
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
